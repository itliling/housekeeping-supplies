<style>
:root{--navy:#174a5b;--navy2:#0f3947;--line:#d9e0e3;--bg:#f3f5f7;--text:#17202a;--muted:#68737d;--green:#2e7d32}
*{box-sizing:border-box}

button:active{transform:scale(.96);filter:brightness(.88);box-shadow:inset 0 2px 5px #0003}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2196f355;outline-offset:2px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:72px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;flex:1}.brand-logo{width:112px;min-width:112px;height:48px;flex:0 0 112px;border:1px solid #ffffff55;border-radius:7px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1;background:#fff;color:var(--navy);font-family:Georgia,serif;box-sizing:border-box}.brand-logo small{font-size:8px;letter-spacing:1.4px;margin-bottom:3px}.brand-logo b{font-size:16px;letter-spacing:1px}.brand-logo span{font-size:8px;letter-spacing:2px;margin-top:4px}.brand h1{margin:0;font-size:21px;display:flex;align-items:center;min-height:0;line-height:1.15;white-space:normal}.lang-select{height:42px;border:1px solid #bcc7cc;border-radius:9px;padding:0 9px;background:#fff;color:var(--text);font-size:14px;font-weight:bold;min-width:112px;flex:0 0 auto}
main{width:min(900px,100%);margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}.card h2{margin:0 0 12px;font-size:20px;line-height:1.25}
.top-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.name-label,.date-label,.remarks-label{display:block;font-weight:bold;font-size:15px;margin:8px 0 6px}.name-input,.remarks-input{width:100%;border:1px solid #bcc7cc;border-radius:9px;background:#fff;color:var(--text)}.name-input{height:44px;padding:0 11px}.remarks-input{min-height:82px;padding:10px 11px;resize:vertical}.muted{color:var(--muted);font-size:14px}.instructions{margin:14px 0 8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,330px);align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #e6eaec}.item:last-child{border-bottom:0}.item strong{font-size:16px;line-height:1.3;overflow-wrap:anywhere}.controls{display:grid;min-width:0;grid-template-columns:minmax(100px,1fr) 42px 72px 42px;gap:6px;align-items:center;width:100%}.unit,.qty,.bag-select{height:42px;min-width:0;border:1px solid #bcc7cc;border-radius:9px;background:#fff;color:var(--text)}.unit{width:100%;padding:0 8px}.qty{width:100%;text-align:center;font-weight:bold;padding:0 5px}.controls button{height:42px;width:42px;border:0;border-radius:9px;background:#e9eef0;font-size:20px;display:flex;align-items:center;justify-content:center}.bag-control{display:flex;justify-content:flex-end}.bag-select{width:112px;padding:0 8px}
.primary,.reset,.share-btn,.danger-btn{width:100%;min-height:46px;border-radius:10px;font-weight:bold;border:0}.primary{background:var(--navy);color:#fff;padding:12px;margin-top:12px}.reset{background:#fff;color:var(--text);border:1px solid #bcc7cc;padding:11px;margin-top:8px}.share-btn{background:var(--green);color:#fff;padding:12px}.danger-btn{background:#fff;color:#a32626;border:1px solid #d9a0a0;padding:10px}.request-actions{display:flex;gap:8px;margin-top:10px}.request-actions>*{flex:1}.small-note{font-size:12px;color:var(--muted);margin:8px 0 0}.action-row{display:flex;gap:10px;width:100%;align-items:stretch}.action-row>*{flex:1;min-width:0;margin:0}
.history-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border:0;padding:0;color:inherit;font-weight:800;text-align:left;min-height:34px}.history-content{display:none;margin-top:14px}.history-content.open{display:block}.request{border:1px solid #d9dfe2;border-radius:12px;padding:14px;margin:10px 0;overflow:hidden}.request h2{font-size:18px;margin:0 0 10px}.request p{margin:5px 0}.request table,.print-sheet table{width:100%;border-collapse:collapse;font-size:15px}.request td,.request th,.print-sheet td,.print-sheet th{padding:9px 7px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.request th,.print-sheet th{font-weight:700;background:#f5f7f8}
.print-sheet{display:none}.print-sheet-inner{max-width:760px;margin:auto;background:#fff;padding:20px}.print-brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}.print-brand .brand-logo{flex:0 0 112px}.print-brand .brand-logo{border-color:#174a5b}.print-brand-title{font-weight:800;font-size:18px;color:var(--navy)}.print-meta{margin:10px 0}.print-meta p{margin:5px 0}.no-print{display:block}
@media(max-width:680px){.controls{grid-template-columns:minmax(0,1fr) 42px minmax(58px,72px) 42px}.unit{min-width:0}.item{min-width:0}main{padding:10px}.card{padding:14px;border-radius:12px}.top-fields{grid-template-columns:1fr}.item{grid-template-columns:1fr;gap:8px}.bag-control{justify-content:flex-start}.controls{grid-template-columns:minmax(0,1fr) 42px 72px 42px}.action-row{gap:8px}}
@media(max-width:390px){header{padding:10px 11px;gap:8px}.brand{align-items:center}.brand{gap:8px}.brand-logo{width:108px;min-width:108px;height:44px;flex:0 0 108px}.brand-logo b{font-size:14px}.brand-logo span{font-size:8px}.brand h1{font-size:18px}.lang-select{min-width:96px;height:40px;font-size:13px}main{padding:8px}.card{padding:12px}.controls{grid-template-columns:minmax(0,1fr) 40px 66px 40px;gap:5px}.controls button{width:40px}.qty{font-size:15px}.unit{font-size:14px}.item strong{font-size:15px}.action-row{gap:6px}.action-row button{font-size:14px;padding-left:7px;padding-right:7px}}
@media(min-width:681px){.card{padding:20px}.history-card{padding:18px 20px}}
@media print{body{background:#fff}.no-print,header,main>.card:not(#printSheet){display:none!important}.print-sheet{display:block!important;box-shadow:none!important;margin:0!important;padding:0!important}.print-sheet-inner{max-width:none;padding:20px}.print-sheet .no-print{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-logo" aria-label="Grecotel LUX ME Dama Dama"><small>Grecotel</small><b>LUX·ME</b><span>DAMA DAMA</span></div><h1 id="appTitle">Housekeeping Supplies</h1></div>
  <select id="languageSelect" class="lang-select" onchange="setLanguage(this.value)" aria-label="Language"><option value="en">English</option><option value="el">Ελληνικά</option><option value="uk">Українська</option></select>
</header>
<main>
<section class="card no-print">
  <h2 id="newRequestTitle">New Request</h2>
  <div class="top-fields">
    <div><label class="name-label" id="nameLabel" for="housekeeperName">Housekeeper Name</label><input id="housekeeperName" class="name-input" type="text" autocomplete="off" placeholder="Enter housekeeper name"></div>
    <div><label class="date-label" id="dateLabel" for="requestDate">Request Date</label><input id="requestDate" class="name-input" type="date"></div>
  </div>
  <p class="muted instructions" id="instructions">Choose Pieces or Packets for each supply, then set the quantity.</p>
  <div id="items"></div>
  <label class="remarks-label" id="remarksLabel" for="remarks">Remarks</label><textarea id="remarks" class="remarks-input" placeholder="Enter remarks (optional)"></textarea>
  <button class="primary" id="submitBtn" onclick="submitRequest()">SUBMIT REQUEST</button>
  <button class="reset" id="resetBtn" onclick="resetForm()">RESET FORM</button>
</section>
<section class="card no-print">
  <button class="history-toggle" onclick="toggleHistory()"><span id="historyTitle">Request History</span><span id="historyArrow">▼</span></button>
<div id="history" class="history-content"><p class="muted">No requests yet.</p></div>
</section>
<section id="printSheet" class="card print-sheet"></section>
</main>
<script>
const T={
 en:{newRequest:'New Request',requestDate:'Request Date',name:'Housekeeper Name',placeholder:'Enter housekeeper name',remarks:'Remarks',remarksPlaceholder:'Enter remarks (optional)',instructions:'Choose Pieces or Packets for each supply, then set the quantity.',submit:'SUBMIT REQUEST',reset:'RESET FORM',history:'Request History',noRequests:'No requests yet.',pieces:'Pieces',packets:'Packets',yes:'Yes',no:'No',required:'Please enter the housekeeper name.',quantity:'Please enter at least one quantity.',appTitle:'Housekeeping Supplies',housekeeper:'Housekeeper',supply:'Supply',quantityLabel:'Quantity',dateTime:'Date/Time',printTitle:'HOUSEKEEPING SUPPLY REQUEST',printButton:'🖨️ PRINT',shareButton:'📤 SHARE',shareTitle:'Housekeeping Supply Request',shareText:'Housekeeping supply request',imageSaved:'Request image saved.',imageError:'Could not create the request image.',deleteButton:'DELETE',deleteConfirm:'Delete this request?',resetConfirm:'Are you sure you want to clear all information entered in this request?',supplies:{Water:'Water',Bags:'Bags',LargeBlanket:'Large Blanket',SmallBlanket:'Small Blanket',LargeLinen:'Large Linen',SmallLinen:'Small Linen',LargePillowcase:'Large Pillowcase',SmallPillowcase:'Small Pillowcase',Bathmat:'Bathmat',SmallTowel:'Small Towel',LargeTowel:'Large Towel',ToiletPaper:'Toilet Paper',LargeDuvetCover:'Large Duvet Cover',SmallDuvetCover:'Small Duvet Cover',Bathrobes:'Bathrobes'}},
 el:{newRequest:'Νέο Αίτημα',requestDate:'Ημερομηνία Αιτήματος',name:'Όνομα Καμαριέρας',placeholder:'Εισάγετε το όνομα',remarks:'Παρατηρήσεις',remarksPlaceholder:'Εισάγετε παρατηρήσεις (προαιρετικό)',instructions:'Επιλέξτε Τεμάχια ή Πακέτα για κάθε είδος και ορίστε την ποσότητα.',submit:'ΥΠΟΒΟΛΗ ΑΙΤΗΜΑΤΟΣ',reset:'ΕΠΑΝΑΦΟΡΑ',history:'Ιστορικό Αιτημάτων',noRequests:'Δεν υπάρχουν αιτήματα.',pieces:'Τεμάχια',packets:'Πακέτα',yes:'Ναι',no:'Όχι',required:'Παρακαλώ εισάγετε το όνομα.',quantity:'Παρακαλώ εισάγετε τουλάχιστον μία ποσότητα.',appTitle:'Προμήθειες Καθαριότητας',housekeeper:'Καμαριέρα',supply:'Είδος',quantityLabel:'Ποσότητα',dateTime:'Ημερομηνία/Ώρα',printTitle:'ΑΙΤΗΜΑ ΠΡΟΜΗΘΕΙΩΝ ΚΑΘΑΡΙΟΤΗΤΑΣ',printButton:'🖨️ ΕΚΤΥΠΩΣΗ',shareButton:'📤 ΚΟΙΝΟΠΟΙΗΣΗ',shareTitle:'Αίτημα Προμηθειών Καθαριότητας',shareText:'Αίτημα προμηθειών καθαριότητας',imageSaved:'Η εικόνα αποθηκεύτηκε.',imageError:'Δεν ήταν δυνατή η δημιουργία της εικόνας.',deleteButton:'ΔΙΑΓΡΑΦΗ',deleteConfirm:'Διαγραφή αυτού του αιτήματος;',resetConfirm:'Είστε βέβαιοι ότι θέλετε να διαγράψετε όλες τις πληροφορίες που έχουν καταχωρηθεί σε αυτό το αίτημα;',supplies:{Water:'Νερό',Bags:'Σακούλες',LargeBlanket:'Μεγάλη κουβέρτα',SmallBlanket:'Μικρή κουβέρτα',LargeLinen:'Μεγάλο σεντόνι',SmallLinen:'Μικρό σεντόνι',LargePillowcase:'Μεγάλη μαξιλαροθήκη',SmallPillowcase:'Μικρή μαξιλαροθήκη',Bathmat:'Πατάκι μπάνιου',SmallTowel:'Μικρή πετσέτα',LargeTowel:'Μεγάλη πετσέτα',ToiletPaper:'Χαρτί υγείας',LargeDuvetCover:'Μεγάλη παπλωματοθήκη',SmallDuvetCover:'Μικρή παπλωματοθήκη',Bathrobes:'Μπουρνούζια'}},
 uk:{newRequest:'Новий запит',requestDate:'Дата запиту',name:'Ім’я покоївки',placeholder:'Введіть ім’я покоївки',remarks:'Примітки',remarksPlaceholder:'Введіть примітки (необов’язково)',instructions:'Виберіть Штуки або Пакети для кожного товару та вкажіть кількість.',submit:'НАДІСЛАТИ ЗАПИТ',reset:'СКИНУТИ ФОРМУ',history:'Історія запитів',noRequests:'Запитів ще немає.',pieces:'Штуки',packets:'Пакети',yes:'Так',no:'Ні',required:'Будь ласка, введіть ім’я покоївки.',quantity:'Будь ласка, введіть хоча б одну кількість.',appTitle:'Приладдя для прибирання',housekeeper:'Покоївка',supply:'Товар',quantityLabel:'Кількість',dateTime:'Дата/час',printTitle:'ЗАПИТ НА ПРИЛАДДЯ ДЛЯ ПРИБИРАННЯ',printButton:'🖨️ ДРУК',shareButton:'📤 ПОДІЛИТИСЯ',shareTitle:'Запит на прибирання',shareText:'Запит на прибирання',imageSaved:'Зображення запиту збережено.',imageError:'Не вдалося створити зображення.',deleteButton:'ВИДАЛИТИ',deleteConfirm:'Видалити цей запит?',resetConfirm:'Ви впевнені, що хочете очистити всю інформацію, введену в цей запит?',supplies:{Water:'Вода',Bags:'Пакети',LargeBlanket:'Велика ковдра',SmallBlanket:'Мала ковдра',LargeLinen:'Велика білизна',SmallLinen:'Мала білизна',LargePillowcase:'Велика наволочка',SmallPillowcase:'Мала наволочка',Bathmat:'Килимок для ванни',SmallTowel:'Малий рушник',LargeTowel:'Великий рушник',ToiletPaper:'Туалетний папір',LargeDuvetCover:'Великий підковдраник',SmallDuvetCover:'Малий підковдраник',Bathrobes:'Халати'}}
};
const supplies=['Water','Bags','LargeBlanket','SmallBlanket','LargeLinen','SmallLinen','LargePillowcase','SmallPillowcase','Bathmat','SmallTowel','LargeTowel','ToiletPaper','LargeDuvetCover','SmallDuvetCover','Bathrobes'];
let lang=localStorage.getItem('hkLang')||'en';let qty=Object.fromEntries(supplies.map(s=>[s,0]));let units=Object.fromEntries(supplies.map(s=>[s,'packets']));let bagChoice='no';
function t(k){return T[lang][k]||T.en[k]||k}function sn(k){return T[lang].supplies[k]||T.en.supplies[k]||k}function unitLabel(u){return u==='pieces'?t('pieces'):t('packets')}
function setLanguage(v){lang=v;localStorage.setItem('hkLang',v);applyLanguage();render();showHistory();const rs=getRequests();if(rs[0])showPrint(rs[0])}
function applyLanguage(){document.documentElement.lang=lang;document.getElementById('languageSelect').value=lang;document.getElementById('appTitle').textContent=t('appTitle');document.getElementById('newRequestTitle').textContent=t('newRequest');document.getElementById('nameLabel').textContent=t('name');document.getElementById('dateLabel').textContent=t('requestDate');document.getElementById('housekeeperName').placeholder=t('placeholder');document.getElementById('remarksLabel').textContent=t('remarks');document.getElementById('remarks').placeholder=t('remarksPlaceholder');document.getElementById('instructions').textContent=t('instructions');document.getElementById('submitBtn').textContent=t('submit');document.getElementById('resetBtn').textContent=t('reset');document.getElementById('historyTitle').textContent=t('history')}
function render(){document.getElementById('items').innerHTML=supplies.map(s=>s==='Bags'?`<div class="item"><strong>${sn(s)}</strong><div class="bag-control"><select class="bag-select" onchange="setBag(this.value)"><option value="no" ${bagChoice==='no'?'selected':''}>${t('no')}</option><option value="yes" ${bagChoice==='yes'?'selected':''}>${t('yes')}</option></select></div></div>`:`<div class="item"><strong>${sn(s)}</strong><div class="controls"><select class="unit" onchange="setUnit('${s}',this.value)"><option value="pieces" ${units[s]==='pieces'?'selected':''}>${t('pieces')}</option><option value="packets" ${units[s]==='packets'?'selected':''}>${t('packets')}</option></select><button type="button" onclick="changeQty('${s}',-1)" aria-label="Decrease ${sn(s)}">−</button><input class="qty" type="number" min="0" step="1" value="${qty[s]}" onchange="setQty('${s}',this.value)" aria-label="${sn(s)} quantity"><button type="button" onclick="changeQty('${s}',1)" aria-label="Increase ${sn(s)}">+</button></div></div>`).join('')}
function changeQty(s,n){qty[s]=Math.max(0,qty[s]+n);render()}function setQty(s,v){let n=Number(v);qty[s]=Number.isFinite(n)&&n>=0?Math.floor(n):0;render()}function setUnit(s,v){units[s]=v}function setBag(v){bagChoice=v}
function resetForm(force=false){if(!force && (document.getElementById('housekeeperName').value.trim()||document.getElementById('remarks').value.trim()||Object.values(qty).some(v=>v>0)||bagChoice==='yes')){if(!confirm(t('resetConfirm')))return}qty=Object.fromEntries(supplies.map(s=>[s,0]));units=Object.fromEntries(supplies.map(s=>[s,'packets']));bagChoice='no';document.getElementById('housekeeperName').value='';document.getElementById('requestDate').value='';document.getElementById('remarks').value='';render()}
function getRequests(){try{return JSON.parse(localStorage.getItem('hkRequests')||'[]')}catch(e){return []}}
function submitRequest(){const name=document.getElementById('housekeeperName').value.trim();const date=document.getElementById('requestDate').value;const remarks=document.getElementById('remarks').value.trim();if(!name){alert(t('required'));return}const items=supplies.filter(s=>s==='Bags'?bagChoice==='yes':qty[s]>0).map(s=>s==='Bags'?{name:s,qty:1,unit:'yes/no'}:{name:s,qty:qty[s],unit:units[s]});if(!items.length){alert(t('quantity'));return}const r={id:Date.now(),date:new Date().toLocaleString(),requestDate:date||new Date().toISOString().slice(0,10),name,remarks,items};const rs=getRequests();rs.unshift(r);localStorage.setItem('hkRequests',JSON.stringify(rs));resetForm(true);showHistory();showPrint(r)}
function formatDate(v){if(!v)return'';const p=v.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function toggleHistory(){const c=document.getElementById('history');const a=document.getElementById('historyArrow');const open=c.classList.toggle('open');a.textContent=open?'▲':'▼'}
function rowHtml(i){return `<tr><td>${sn(i.name)}</td><td>${i.name==='Bags'?t('yes'):`${i.qty} ${unitLabel(i.unit)}`}</td></tr>`}
function metaHtml(r){return `<div class="print-meta"><p><b>${t('dateTime')}:</b> ${escapeHtml(r.date)}</p><p><b>${t('requestDate')}:</b> ${formatDate(r.requestDate)}</p><p><b>${t('housekeeper')}:</b> ${escapeHtml(r.name)}</p>${r.remarks?`<p><b>${t('remarks')}:</b> ${escapeHtml(r.remarks)}</p>`:''}</div>`}
function brandHtml(){return `<div class="print-brand"><div class="brand-logo"><b>LUX·ME</b><span>DAMA DAMA</span></div><div class="print-brand-title">Grecotel LUX·ME Dama Dama</div></div>`}
function formHtml(r,buttons=true){const rid=String(r.id);return `${brandHtml()}<h2>${t('printTitle')}</h2>${metaHtml(r)}<table><thead><tr><th>${t('supply')}</th><th>${t('quantityLabel')}</th></tr></thead><tbody>${r.items.map(rowHtml).join('')}</tbody></table>${buttons?`<div class="no-print action-row" style="margin-top:14px"><button class="primary" onclick="printRequest(${rid})">${t('printButton')}</button><button class="share-btn" onclick="shareRequest(${rid})">${t('shareButton')}</button></div><div class="no-print request-actions"><button class="danger-btn" onclick="deleteRequest(${rid})">${t('deleteButton')}</button></div>`:''}` }
function deleteRequest(id){if(!confirm(t('deleteConfirm')))return;const rs=getRequests().filter(r=>String(r.id)!==String(id));localStorage.setItem('hkRequests',JSON.stringify(rs));showHistory();const latest=rs[0];if(latest)showPrint(latest);else{document.getElementById('printSheet').innerHTML='';document.getElementById('printSheet').style.display='none'}}
function findRequest(id){return getRequests().find(r=>String(r.id)===String(id))}function printRequest(id){const r=findRequest(id);if(!r)return;showPrint(r);setTimeout(()=>{if(window.Android&&Android.printPage){Android.printPage()}else{window.print()}},100)}function showPrint(r){const p=document.getElementById('printSheet');p.innerHTML=`<div class="print-sheet-inner">${formHtml(r,true)}</div>`;p.style.display='block';p.dataset.request=JSON.stringify(r)}
function showHistory(){const h=document.getElementById('history');const rs=getRequests();if(!rs.length){h.innerHTML=`<p class="muted">${t('noRequests')}</p>`;return}h.innerHTML=rs.map(r=>`<div class="request">${formHtml(r,true)}</div>`).join('')}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function shareRequest(id){const r=id?findRequest(id):JSON.parse(document.getElementById('printSheet').dataset.request||'null');if(r)createShareImage(r)}
function createShareImage(r){const rows=r.items.map(i=>[sn(i.name),i.name==='Bags'?t('yes'):`${i.qty} ${unitLabel(i.unit)}`]);const width=1200,pad=70;const line=48;const rowH=54;const metaCount=r.remarks?4:3;const height=330+metaCount*line+rows.length*rowH+110;const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');let y=65;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="100%" height="12" fill="#174a5b"/><text x="${pad}" y="${y}" font-family="Arial" font-size="28" font-weight="700" fill="#174a5b">LUX·ME</text><text x="${pad}" y="${y+28}" font-family="Arial" font-size="15" letter-spacing="4" fill="#174a5b">DAMA DAMA</text><text x="300" y="${y+18}" font-family="Arial" font-size="25" font-weight="700" fill="#174a5b">Grecotel LUX·ME Dama Dama</text>`;y+=95;svg+=`<text x="${pad}" y="${y}" font-family="Arial" font-size="25" font-weight="700" fill="#17202a">${esc(t('printTitle'))}</text>`;y+=55;const metas=[[t('dateTime'),r.date],[t('requestDate'),formatDate(r.requestDate)],[t('housekeeper'),r.name]];if(r.remarks)metas.push([t('remarks'),r.remarks]);for(const [a,b] of metas){svg+=`<text x="${pad}" y="${y}" font-family="Arial" font-size="19" fill="#17202a"><tspan font-weight="700">${esc(a)}:</tspan> ${esc(b)}</text>`;y+=line}const x1=pad,x2=850;svg+=`<rect x="${x1}" y="${y}" width="${width-pad*2}" height="50" fill="#f0f3f4"/><text x="${x1+12}" y="${y+32}" font-family="Arial" font-size="19" font-weight="700">${esc(t('supply'))}</text><text x="${x2}" y="${y+32}" font-family="Arial" font-size="19" font-weight="700">${esc(t('quantityLabel'))}</text>`;y+=50;rows.forEach((row,idx)=>{svg+=`<line x1="${x1}" y1="${y+rowH}" x2="${width-x1}" y2="${y+rowH}" stroke="#d9dfe2"/><text x="${x1+12}" y="${y+34}" font-family="Arial" font-size="18">${esc(row[0])}</text><text x="${x2}" y="${y+34}" font-family="Arial" font-size="18">${esc(row[1])}</text>`;y+=rowH});svg+=`<text x="${pad}" y="${height-30}" font-family="Arial" font-size="14" fill="#68737d">Grecotel LUX·ME Dama Dama</text></svg>`;const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=width*2;canvas.height=height*2;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(async png=>{URL.revokeObjectURL(url);if(!png){alert(t('imageError'));return}const file=new File([png],'housekeeping-request.png',{type:'image/png'});try{if(window.Android&&Android.shareImage){const reader=new FileReader();reader.onloadend=()=>Android.shareImage(reader.result.split(',')[1]);reader.readAsDataURL(png);return}if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:t('shareTitle'),text:t('shareText'),files:[file]});return}if(navigator.share){await navigator.share({title:t('shareTitle'),text:t('shareText')});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(png);a.download='housekeeping-request.png';a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);alert(t('imageSaved'))},500)},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);alert(t('imageError'))};img.src=url}
applyLanguage();render();showHistory();
</script>
